<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Community Store</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/images/community-store-favicon.png"
    >

    <link
        rel="stylesheet"
        href="css/forgot-password.css"
    >
</head>

<body>

    <main class="forgot-page">

        <div class="background-overlay"></div>

        <section class="forgot-card">

            <!-- Logo -->
            <img
                src="assets/images/community-store-logo.png"
                alt="Community Store Logo"
                class="forgot-logo"
            >


            <!-- Heading -->
            <div class="welcome-text">

                <h1>Forgot your password?</h1>

                <p>
                    No worries. Enter your email and we'll
                    help you reset it.
                </p>

            </div>


            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm">

                <!-- Email -->
                <div class="input-group">

                    <label for="email">
                        Email address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- Reset Button -->
                <button
                    type="submit"
                    class="reset-button"
                >

                    Send Reset Link

                    <span>→</span>

                </button>

            </form>


            <!-- Back to Login -->
            <a
                href="login.html"
                class="back-login"
            >

                <span>←</span>

                Back to Sign In

            </a>

        </section>

    </main>


    <script src="js/forgot-password.js"></script>

</body>

</html>
