<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Store</title>

    <!-- Community Store browser icon -->
    <link
        rel="icon"
        type="image/png"
        href="assets/images/community-store-favicon.png"
    >

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="splash-screen">

        <!-- Background overlay -->
        <div class="overlay"></div>

        <!-- Welcome content -->
        <section class="welcome-content">

            <img
                src="assets/images/community-store-logo.png"
                alt="Community Store Logo"
                class="logo"
            >

            <p class="tagline">
                Buy • Sell • Connect
            </p> 

            <button
                id="getStartedBtn"
                onclick="window.location.href='login.html'"
            >
                Get Started
                <span>→</span>
            </button>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
