<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Community Store</title>

    <link rel="stylesheet" href="css/register.css">
</head>

<body>

<main class="register-page">

    <div class="background-overlay"></div>

    <section class="register-card">

        <!-- Logo -->
        <img
            src="assets/images/community-store-logo.png"
            alt="Community Store Logo"
            class="register-logo"
        >


        <!-- Heading -->
        <div class="welcome-text">

            <h1>Create your account</h1>

            <p>Join the Community Store today</p>

        </div>


        <!-- Registration Form -->
        <form id="registerForm">

            <!-- Full Name -->
            <div class="input-group">

                <label for="fullName">
                    Full name
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">👤</span>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

            </div>


            <!-- User Type -->
            <div class="input-group">

                <label for="userType">
                    I am a
                </label>

                <div class="input-wrapper select-wrapper">

                    <span class="input-icon">👤</span>

                    <select
                        id="userType"
                        name="userType"
                        required
                    >

                        <option
                            value=""
                            disabled
                            selected
                        >
                            Select your user type
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="tutor">
                            Tutor
                        </option>

                        <option value="vendor">
                            Vendor
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <!-- Email -->
            <div class="input-group">

                <label for="email">
                    Email address
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">✉</span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <!-- Password -->
            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('password', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- Confirm Password -->
            <div class="input-group">

                <label for="confirmPassword">
                    Confirm password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- Terms -->
            <div class="terms">

                <label class="checkbox-container">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                    </span>

                </label>

            </div>


            <!-- Create Account -->
            <button
                type="submit"
                class="create-account-button"
            >

                Create Account

                <span>→</span>

            </button>

        </form>


        <!-- Divider -->
        <div class="divider">

            <span></span>

            <p>or</p>

            <span></span>

        </div>


        <!-- Social Login -->
        <div class="social-login">

            <button
                type="button"
                class="social-button"
            >

                <span class="google-icon">
                    G
                </span>

                Google

            </button>


            <button
                type="button"
                class="social-button"
            >

                <span class="apple-icon">
                    ●
                </span>

                Apple

            </button>

        </div>


        <!-- Login -->
        <p class="login-text">

            Already have an account?

            <a href="login.html">
                Sign in
            </a>

        </p>

    </section>


    <!-- JavaScript -->
    <script src="js/register.js"></script>

</main>

</body>

</html>
